spring.application.name=hubstaff-backend

spring.datasource.url=jdbc:mariadb://localhost:3307/hubstaff-test
spring.datasource.username=root
spring.datasource.password=hubstaff123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway creates a fresh schema from migrations and records each applied version.
# Existing databases previously created by Hibernate are treated as version 3,
# matching the schema that predates Flyway in this project.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

server.port=8080

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# When enabled, bootstrap runs at most once per database and records completion.
# Do not put these credentials in this file; provide them as deployment environment variables.
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}
bootstrap.admin.employee-code=${INITIAL_ADMIN_EMPLOYEE_CODE:}
bootstrap.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:}
bootstrap.admin.last-name=${INITIAL_ADMIN_LAST_NAME:}
bootstrap.admin.phone=${INITIAL_ADMIN_PHONE:}
bootstrap.admin.hire-date=${INITIAL_ADMIN_HIRE_DATE:}

# Reverse-geocoding is performed server-side and cached. Set GEOCODING_ENABLED=false
# when no approved provider is configured.
geocoding.enabled=${GEOCODING_ENABLED:true}
geocoding.provider-url=${GEOCODING_PROVIDER_URL:https://nominatim.openstreetmap.org/reverse}
geocoding.user-agent=${GEOCODING_USER_AGENT:hubstaff-workforce-management/1.0 (contact: admin@example.com)}
geocoding.minimum-interval-ms=${GEOCODING_MINIMUM_INTERVAL_MS:1100}
